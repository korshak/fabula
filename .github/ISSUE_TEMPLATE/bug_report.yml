name: Bug report
description: Something behaves differently than it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. If the problem is a security vulnerability,
        please report it privately instead — see SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >
        The commands you ran, or the clicks in the studio. A minimal `.fab`
        source that triggers it is the single most useful thing you can attach.
      placeholder: |
        1. fabula init example
        2. edit book.fab: …
        3. fabula compile example
      render: shell
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: The diagnostics, traceback or console error, verbatim.
      render: shell

  - type: input
    id: version
    attributes:
      label: Fabula version
      description: "`pip show fabula-lang`, or the commit you are on."
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python and OS
      placeholder: "Python 3.12.4, macOS 15.3"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where
      multiple: true
      options:
        - Language / compiler (lexer, parser, diagnostics)
        - Serializer (.fab round-trip)
        - Web studio (server or UI)
        - CLI
        - Model providers / generation
        - Translation
        - EPUB / manuscript export
        - Locales / i18n
        - Docs
        - Not sure

  - type: input
    id: provider
    attributes:
      label: Model provider
      description: If generation is involved — which profile from models.json.
      placeholder: "claude-cli / anthropic / openai-compatible (which one)"
