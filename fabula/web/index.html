    pre + hold(`<a href="${esc(url)}">`) + esc(url) + hold("</a>"));

  const wrap = tag => (m, body) => `<${tag}>${body}</${tag}>`;
  s = s.replace(/~~(?=\S)([\s\S]*?\S)~~/g, wrap("del"));
  s = s.replace(/\*\*\*(?=\S)([\s\S]*?\S)\*\*\*/g, (m, b) => `<strong><em>${b}</em></strong>`);
  s = s.replace(/___(?=\S)([\s\S]*?\S)___/g, (m, b) => `<strong><em>${b}</em></strong>`);
  s = s.replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, wrap("strong"));
  s = s.replace(/__(?=\S)([\s\S]*?\S)__/g, wrap("strong"));
  s = s.replace(/\*(?=\S)([^*\n]*?\S)\*/g, wrap("em"));
  // a lone underscore inside a word (snake_case) is not emphasis
  s = s.replace(/(^|[^\p{L}\p{N}_])_(?=\S)([^_\n]*?\S)_(?![\p{L}\p{N}_])/gu,
                (m, pre, body) => pre + `<em>${body}</em>`);

  s = s.replace(/[ \t]*\n/g, "<br>");              // a single newline is a hard break here
  return s.replace(new RegExp(MD_HOLE + "(\\d+)" + MD_HOLE, "g"), (m, n) => slots[+n]);
}

/* ---------- markdown: the editable document back to a .md file ----------
   Escaping is staged, not blanket: a text run is written as plainly as it can
   be, and only if reading the file back would say something else does the next
   stage kick in. Prose files stay clean — an author who never types markup
   never sees a backslash. */

const MD_SKIP_TAGS = new Set(["SCRIPT", "STYLE", "NOSCRIPT", "TEMPLATE", "HEAD", "LINK", "META"]);
const MD_BLOCK_TAGS = new Set(["P", "DIV", "SECTION", "ARTICLE", "LI",
                               "H1", "H2", "H3", "H4", "H5", "H6",
                               "BLOCKQUOTE", "PRE", "UL", "OL", "TABLE"]);
const MD_LEAF_TAGS = new Set(["HR", "UL", "OL", "TABLE", "PRE", "BLOCKQUOTE",
                              "H1", "H2", "H3", "H4", "H5", "H6"]);
const MD_STAGES = [
  s => s,
  s => s.replace(/\\/g, "\\\\").replace(/([*`])/g, "\\$1"),
  s => s.replace(/\\/g, "\\\\").replace(/([*`_~\[\]!|])/g, "\\$1"),
];

// a paragraph line that would read as a list, heading, quote or table gets a guard
function mdGuardLine(l) {
  const ol = l.match(/^(\s*)(\d{1,9})([.)])(?=\s)/);          // \1 is not an escape; \. is
  if (ol) return `${ol[1]}${ol[2]}\\${ol[3]}` + l.slice(ol[0].length);
  return l.replace(/^(\s*)((?:[-+*](?=\s))|(?:#{1,6}(?=\s))|>|\|)/, "$1\\$2")
          .replace(/^(\s*)(=+|-+)(\s*)$/, "$1\\$2$3");
}

function htmlToMd(root, stage = 0) {
  let level = stage;                                 // raised per paragraph, not per file
  const escRun = s => MD_STAGES[level](s.replace(/\u00a0/g, " "));
  const norm = s => s.replace(/\s+/g, " ").trim();
  // markdown markers cannot hug a space, so whitespace the selection swept up
  // moves back outside them — otherwise "*Крива* на" collapses to "*Крива*на"
  const emph = (body, mark) => {
    const m = body.match(/^(\s*)([\s\S]*?)(\s*)$/);
    return m[2] ? m[1] + mark + m[2] + mark + m[3] : body;
  };
  const attr = (el, name) => (el.getAttribute(name) || "").trim();
  const ticksFor = body =>
    "`".repeat(Math.max(1, ...[...body.matchAll(/`+/g)].map(m => m[0].length + 1)));

  const inlineOf = n => {
    if (n.nodeType === 3) return escRun(n.nodeValue);
    if (n.nodeType !== 1 || MD_SKIP_TAGS.has(n.nodeName)) return "";
    const tag = n.nodeName;
    if (tag === "BR") return "\n";
    if (tag === "IMG") {
      const t = attr(n, "title");
      return `![${attr(n, "alt")}](${attr(n, "src")}${t ? ` "${t}"` : ""})`;
    }
    if (tag === "CODE" && n.parentElement?.nodeName !== "PRE") {
      const body = n.textContent.replace(/\u00a0/g, " ");
      const ticks = ticksFor(body);
      return ticks + (/^`|`$/.test(body) ? ` ${body} ` : body) + ticks;
    }
    const inner = [...n.childNodes].map(inlineOf).join("");
    if (tag === "STRONG" || tag === "B") return emph(inner, "**");
    if (tag === "EM" || tag === "I") return emph(inner, "*");
    if (tag === "DEL" || tag === "S" || tag === "STRIKE") return emph(inner, "~~");
    if (tag === "A") {
      const href = attr(n, "href");
      if (!href) return inner;
      const t = attr(n, "title");
      if (!t && (href === inner || href === "mailto:" + inner)) return `<${href}>`;
      return `[${inner}](${href}${t ? ` "${t}"` : ""})`;
    }
    return inner;
  };

  const plainOf = n => {
    if (n.nodeType === 3) return n.nodeValue.replace(/\u00a0/g, " ");
    if (n.nodeType !== 1 || MD_SKIP_TAGS.has(n.nodeName)) return "";
    if (n.nodeName === "BR") return "\n";
    if (n.nodeName === "IMG") return attr(n, "alt");
    return [...n.childNodes].map(plainOf).join("");
  };

  const blocks = [];
  let buf = "";
  const flush = () => {
    const md = buf.replace(/[ \t]+$/gm, "").trim();
    if (md) blocks.push(md.split("\n").map(mdGuardLine).join("\n"));
    buf = "";
  };

  const listOf = node => {
    const ordered = node.nodeName === "OL";
    let n = parseInt(node.getAttribute("start") || "1", 10) || 1;
    return [...node.children].filter(c => c.nodeName === "LI").map(li => {
      const marker = ordered ? `${n++}. ` : "- ";
      const pad = " ".repeat(marker.length);
      const box = li.querySelector(":scope > input[type=checkbox]");
      const nested = [...li.children].filter(c => c.nodeName === "UL" || c.nodeName === "OL");
      const own = document.createElement("div");
      for (const c of [...li.childNodes])
        if (!(c.nodeType === 1 && (c === box || c.nodeName === "UL" || c.nodeName === "OL")))
          own.appendChild(c.cloneNode(true));
      let body = htmlToMd(own, stage).trim();
      if (box) body = `[${box.checked ? "x" : " "}] ` + body;
      const sub = nested.map(listOf).join("\n");
      return marker + body.split("\n").join("\n" + pad)
           + (sub ? "\n" + sub.split("\n").map(l => pad + l).join("\n") : "");
    }).join("\n");
  };

  const tableOf = node => {
    const rows = [...node.querySelectorAll("tr")];
    if (!rows.length) return "";
    const cellsOf = tr => [...tr.children].map(td =>
      inlineOf(td).replace(/\s*\n\s*/g, " ").replace(/\|/g, "\\|").trim());
    const head = cellsOf(rows[0]);
    const align = [...rows[0].children].map(td => {
      const a = (td.style.textAlign || "").toLowerCase();
      return a === "center" ? ":-:" : a === "right" ? "--:" : a === "left" ? ":--" : "---";
    });
    const body = rows.slice(1).map(tr => {
      const c = cellsOf(tr);
      return "| " + head.map((_, k) => c[k] ?? "").join(" | ") + " |";
    });
    return ["| " + head.join(" | ") + " |", "| " + align.join(" | ") + " |", ...body].join("\n");
  };

  // Write the paragraph as plainly as it can be written: try the lightest
  // escaping first and step up only if reading the line back would no longer
  // say the same thing. One awkward sentence never litters the whole file.
  const paragraphOf = node => {
    const want = norm(plainOf(node));
    let md = "";
    for (level = stage; level < MD_STAGES.length; level++) {
      md = inlineOf(node);
      const probe = document.createElement("div");
      probe.innerHTML = mdToHtml(md.split("\n").map(mdGuardLine).join("\n"));
      if (norm(probe.textContent) === want) break;
    }
    level = stage;
    return md;
  };

  const take = node => {
    if (node.nodeType === 1 && !MD_SKIP_TAGS.has(node.nodeName)) {
      const tag = node.nodeName;
      if (tag === "HR") { flush(); blocks.push("***"); return; }
      if (/^H[1-6]$/.test(tag)) {
        flush();
        const t = inlineOf(node).replace(/\s*\n\s*/g, " ").trim();
        if (t) blocks.push("#".repeat(+tag[1]) + " " + t);
        return;
      }
      if (tag === "PRE") {
        flush();
        const code = node.querySelector("code");
        const lang = ((code?.className || "").match(/language-([\w+#.-]+)/) || [, ""])[1];
        const body = (code || node).textContent.replace(/\u00a0/g, " ").replace(/\n+$/, "");
        const fence = "`".repeat(Math.max(3, ...[...body.matchAll(/`+/g)].map(m => m[0].length + 1)));
        blocks.push(`${fence}${lang}\n${body}\n${fence}`);
        return;
      }
      if (tag === "BLOCKQUOTE") {
        flush();
        blocks.push(htmlToMd(node, stage).split("\n").map(l => (l ? "> " + l : ">")).join("\n"));
        return;
      }
      if (tag === "UL" || tag === "OL") { flush(); const l = listOf(node); if (l) blocks.push(l); return; }
      if (tag === "TABLE") { flush(); const t = tableOf(node); if (t) blocks.push(t); return; }
      if (MD_BLOCK_TAGS.has(tag)) {
        flush();
        // a wrapper holding other blocks contributes nothing of its own;
        // its loose inline children still gather into one paragraph
        if ([...node.children].some(c => MD_BLOCK_TAGS.has(c.nodeName) || MD_LEAF_TAGS.has(c.nodeName)))
          for (const c of [...node.childNodes]) take(c);
        else buf = paragraphOf(node);
        flush();
        return;
      }
      if (MD_SKIP_TAGS.has(tag)) return;
    }
    if (node.nodeType === 1 && MD_SKIP_TAGS.has(node.nodeName)) return;
    buf += inlineOf(node);
  };

  for (const n of [...root.childNodes]) take(n);
  flush();
  const md = blocks.join("\n\n").replace(/\n{3,}/g, "\n\n").trim();

  // last net: if the whole file would still read differently, escape harder
  if (stage < MD_STAGES.length - 1) {
    const probe = document.createElement("div");
    probe.innerHTML = mdToHtml(md);
    if (norm(probe.textContent) !== norm(root.textContent)) return htmlToMd(root, stage + 1);
  }
  return md;
}

const mdWords = s =>
  (String(s ?? "").replace(/\(https?:[^)\s]*\)/g, "").replace(/[*_`~#>|\\\[\]]/g, "")
                 .match(/\S+/g) || []).length;

/* caret as a plain text offset, so an edit survives a background re-render */
function caretOffset(root) {
  const sel = getSelection();
  if (!sel || !sel.rangeCount || !root.contains(sel.anchorNode)) return null;
  const live = sel.getRangeAt(0);
  const r = document.createRange();
  r.selectNodeContents(root);
  r.setEnd(live.endContainer, live.endOffset);
  return r.toString().length;
}

function setCaret(root, offset) {
  if (offset == null) return;
  const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let seen = 0;
  for (let n = walk.nextNode(); n; n = walk.nextNode()) {
    if (seen + n.nodeValue.length >= offset) {
      const r = document.createRange();
      r.setStart(n, offset - seen);
      r.collapse(true);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      return;
    }
    seen += n.nodeValue.length;
  }
  const r = document.createRange();
  r.selectNodeContents(root); r.collapse(false);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
}

const wordCount = s => (String(s ?? "").match(/\S+/g) || []).length;
const isNarrow = () => window.matchMedia("(max-width: 1180px)").matches;
const MOD = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent) ? "⌘" : "Ctrl";

/* which variant the reading column shows: the reader's pick, else the approved
   one, else the first */
function pickedVariant(sceneName, st, variants) {
  const chosen = S.variantPick[sceneName];
  if (chosen && variants.some(([f]) => f === chosen)) return chosen;
  if (st.approved && variants.some(([f]) => f === st.approved)) return st.approved;
  return variants[0][0];
}

function renderScene() {
  const pane = $("#pane");
  const found = S.scene && findScene(S.scene);
  if (!found) {
    pane.innerHTML = `<div class="empty-state">
      <div class="glyph">❧</div>
      <h3>${esc(t("ui.scene.empty_title"))}</h3>
      <p>${esc(t("ui.scene.empty_text"))}</p>
      <button class="primary" onclick="setTab('builder')">${esc(t("ui.scene.open_builder"))}</button>
    </div>`;
    return;
  }
  const {act, ch, sc} = found;
  const st = sceneState(sc.name);
  const gen = currentProvider();
  const running = S.project.jobs.some(j => j.status==="running" && j.kind==="generate" && j.scene===sc.name);
  const rng = sc.length?.range;
  const status = sceneStatus(sc.name);
  const names = sceneList();
  const idx = names.indexOf(sc.name);

  const specItems = [
    sc.pov && `<div class="spec-item"><div class="k">${esc(t("ui.scene.pov"))}</div><div class="v pov">${esc(sc.pov)}</div></div>`,
    sc.location && `<div class="spec-item"><div class="k">${esc(t("ui.scene.location"))}</div><div class="v">${esc(sc.location)}</div></div>`,
    sc.time && `<div class="spec-item"><div class="k">${esc(t("ui.scene.time"))}</div><div class="v">${esc(sc.time)}</div></div>`,
    rng && `<div class="spec-item"><div class="k">${esc(t("ui.scene.length"))}</div><div class="v">${esc(t("ui.scene.length_words", {a: rng[0], b: rng[1]}))}</div></div>`,
    `<div class="spec-item"><div class="k">${esc(t("ui.scene.variants"))}</div><div class="v">${sc.variants || 1}</div></div>`,
    sc.cast?.length ? `<div class="spec-item"><div class="k">${esc(t("ui.scene.cast"))}</div><div class="v">${esc(sc.cast.join(", "))}</div></div>` : null,
    sc.kill?.length ? `<div class="spec-item"><div class="k">${esc(t("ui.scene.kill"))}</div><div class="v" style="color:var(--blood)">${esc(sc.kill.join(", "))}</div></div>` : null,
    sc.threads?.length ? `<div class="spec-item"><div class="k">${esc(t("ui.builder.scene_threads"))}</div><div class="v" style="color:var(--violet)">${esc(sc.threads.join(", "))}</div></div>` : null,
  ].filter(Boolean).join("");

  // the collapsed contract still says who, where and how long
  const digest = [
    sc.pov && `<b>${esc(sc.pov)}</b>`,
    sc.location && esc(sc.location),
    sc.time && esc(sc.time),
    rng && esc(t("ui.scene.length_words", {a: rng[0], b: rng[1]})),
  ].filter(Boolean).join(" · ");
  const beatCount = (sc.show?.length || 0) + (sc.forbid?.length || 0);
  const specOpen = S.specOpen ?? !isNarrow();

  const variants = Object.entries(st.variants);
  const picked = variants.length ? pickedVariant(sc.name, st, variants) : null;
  const variantsPhrase = (sc.variants || 1) > 1
    ? t("ui.scene.variants_n", {n: sc.variants}) : t("ui.scene.variant_one");

  const switcher = variants.length > 1 ? `<div class="vswitch">${variants.map(([file, v]) => {
    const verdict = v.critique?.verdict === "ok" ? "ok" : (v.critique?.violations?.length ? "issues" : "");
    const wc = v.critique?.word_count_estimate;
    return `<button class="${file === picked ? "on" : ""} ${st.approved === file ? "appr" : ""}" data-vpick="${esc(file)}">
      ${esc(file)}<span class="vdot ${verdict}"></span>${wc ? `<span class="vwc">${esc(t("ui.scene.words", {n: wc}))}</span>` : ""}
    </button>`;
  }).join("")}</div>` : "";

  const genNote = !gen.available ? gen.reason : (!S.project.result.ok ? t("ui.scene.fix_first") : "");

  pane.innerHTML = `
  <div class="scene-wrap">
    <div class="scene-top">
      <span class="eyebrow">${esc(t("ui.scene.eyebrow", {act: act.number, ch: ch.number, title: ch.title}))}</span>
      <span class="status-pill ${status}">${esc(t("ui.status." + status))}</span>
      <div class="scene-nav">
        <button ${idx <= 0 ? "disabled" : ""} data-nav="-1" title="${esc(t("ui.scene.prev"))}">‹</button>
        <button ${idx >= names.length - 1 ? "disabled" : ""} data-nav="1" title="${esc(t("ui.scene.next"))}">›</button>
      </div>
    </div>
    <div class="scene-head">
      <span class="scene-title">${esc(sc.name)}</span>
      <button class="read-toggle" id="focusBtn" title="${esc(t("ui.scene.focus_title"))}">
        ${ICON.expand}${esc(S.focusRead ? t("ui.scene.focus_exit") : t("ui.scene.focus"))}
      </button>
    </div>

    <div class="scene-cols">
      <div class="reading">
        ${switcher}
        <div class="variants" id="variants"></div>
        ${!variants.length && !running ? `<div class="empty-state">
          <div class="glyph">✒</div>
          <h3>${esc(t("ui.scene.not_written_title"))}</h3>
          <p>${esc(t("ui.scene.not_written_text", {v: variantsPhrase}))}</p>
        </div>` : ""}
        <details class="prompt-view"><summary>${esc(t("ui.scene.prompts"))}</summary><pre id="promptPre">…</pre></details>
      </div>

      <div class="scene-aside">
        <button class="primary" id="genBtn" ${(!gen.available || running || !S.project.result.ok) ? "disabled":""}>
          ${running ? `<span class="pulse">${esc(t("ui.scene.generating"))}</span>`
            : esc(variants.length ? t("ui.scene.regenerate") : t("ui.scene.generate")) + (gen.name ? ` · ${esc(gen.name)}` : "")}
        </button>
        ${genNote ? `<span class="editor-note">${esc(genNote)}</span>` : ""}
        ${variants.length ? `<details class="prompt-view"><summary>${esc(t("ui.scene.rewrite"))}</summary>
          <div class="rw-box">
            <textarea id="rewriteNote" rows="3" placeholder="${esc(t("ui.scene.rewrite_ph"))}"></textarea>
            <button id="rewriteBtn" ${(!gen.available || running) ? "disabled" : ""}>${esc(t("ui.scene.rewrite_btn"))}</button>
          </div></details>` : ""}
        <details class="spec-card" id="specCard" ${specOpen ? "open" : ""}>
          <summary>${ICON.caret}<span class="ttl">${esc(t("ui.scene.spec"))}</span>
            <span class="digest">${digest || esc(t("ui.scene.spec"))}</span>
            ${beatCount ? `<span class="cnt">${esc(tn("ui.scene.beats_n", beatCount))}</span>` : ""}</summary>
          <div class="spec-body">
            <div class="spec-grid">${specItems}</div>
            ${sc.show.length ? `<div class="spec-sec"><span class="lbl">${esc(t("ui.scene.show"))}</span>
              <ul class="beats">${sc.show.map(b=>`<li>${esc(b)}</li>`).join("")}</ul></div>` : ""}
            ${sc.forbid.length ? `<div class="spec-sec"><span class="lbl">${esc(t("ui.scene.forbid"))}</span>
              <ul class="beats forbid">${sc.forbid.map(b=>`<li>${esc(b)}</li>`).join("")}</ul></div>` : ""}
          </div>
        </details>
        ${st.summary ? `<div class="summary-block">${esc(t("ui.scene.memory", {s: st.summary}))}${st.summary_stale ? ` <span style="color:var(--candle);font-style:normal;font-size:12px">${esc(t("ui.scene.memory_stale"))}</span>` : ""}</div>` : ""}
      </div>
    </div>
  </div>`;

  pane.querySelectorAll("[data-nav]").forEach(b => b.addEventListener("click", () => {
    S.scene = names[idx + Number(b.dataset.nav)];
    render();
  }));
  pane.querySelectorAll("[data-vpick]").forEach(b => b.addEventListener("click", () => {
    S.variantPick[sc.name] = b.dataset.vpick;
    render();
  }));
  // Chrome also fires `toggle` for a <details> rendered open — only a change
  // away from what we rendered is the reader's own choice
  const spec = $("#specCard");
  spec?.addEventListener("toggle", () => { if (spec.open !== specOpen) S.specOpen = spec.open; });
  $("#focusBtn").addEventListener("click", () => setFocusRead(!S.focusRead));
  $("#genBtn").addEventListener("click", () => generateScene(sc.name));
  $("#rewriteBtn")?.addEventListener("click", () =>
    generateScene(sc.name, $("#rewriteNote")?.value?.trim() || ""));
  const det = $("#promptPre").closest("details");
  det.addEventListener("toggle", async () => {
    if (det.open) {
      try {
        const p = await api("/api/prompt?scene=" + encodeURIComponent(sc.name));
        $("#promptPre").textContent = "=== SYSTEM ===\n\n" + p.system + "\n\n=== USER ===\n\n" + p.user;
      } catch (e) { $("#promptPre").textContent = t("ui.source.error", {e: e.message}); }
    }
  });
  return renderVariants(sc.name, st, variants, picked);  // render() restores scroll when it settles
}

// the contract sits in the rail on wide screens and collapses on narrow ones,
// so a resize across the breakpoint has to re-render the scene
(() => {
  let wasNarrow = isNarrow();
  window.addEventListener("resize", () => {
    const now = isNarrow();
    if (now === wasNarrow) return;
    wasNarrow = now;
    if (S.tab === "scene" && S.project) render();
  });
})();

// keep a popover on screen, anchored under whatever it is about
function placePopover(pop, rect) {
  pop.style.left = Math.max(8, Math.min(rect.left,
                                        innerWidth - pop.offsetWidth - 12)) + "px";
  pop.style.top = Math.max(8, Math.min(rect.bottom + 8,
                                       innerHeight - pop.offsetHeight - 12)) + "px";
}

function setFocusRead(on) {
  S.focusRead = on;
  try { localStorage.setItem("fabula.focusRead", on ? "1" : ""); } catch {}
  document.body.classList.toggle("focus-read", on && S.tab === "scene");
  render();
}

  const key = sceneName + "::" + file;

  if (draft) {
    const bar = wrap.querySelector("#draftWc");
    const count = () => { bar.textContent = t("ui.scene.words", {n: mdWords(draft.text)}); };
    const grow = ta => {
      ta.style.height = "auto";
      ta.style.height = ta.scrollHeight + (ta.offsetHeight - ta.clientHeight) + "px";
    };
    const cancel = () => { S.variantDraft = null; render(); };
    const save = async () => {
      const text = draft.text;
      S.variantDraft = null;
      try {
        const d = await api("/api/variant/save", {method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({scene: sceneName, file, text, provider: currentProvider().name})});
        S.variantTexts[key] = text;
        showToast(d.job ? t("ui.scene.resummarizing") : t("ui.scene.edit_ok"), "ok");
        if (d.job) watchJobs(d.job.id, async () => { await load(); });
        await load();
      } catch (err) { showToast(t("ui.scene.edit_fail", {e: err.message}), "err"); }
    };
    const keys = e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); }
      else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); cancel(); }
    };
    wrap.querySelector(".v-cancel").addEventListener("click", cancel);
    wrap.querySelector(".v-save").addEventListener("click", save);
    wrap.querySelector(".md-mode").addEventListener("click", () => {
      draft.mode = draft.mode === "md" ? "rich" : "md";   // same markdown, two ways in
      draft.sel = null;
      render();
    });
    count();

    if (draft.mode === "md") {
      const ta = wrap.querySelector(".md-src");
      ta.value = draft.text;
      grow(ta);
      ta.focus();
      const at = draft.sel ?? ta.value.length;
      ta.setSelectionRange(at, at);
      const remember = () => { draft.text = ta.value; draft.sel = ta.selectionStart; count(); };
      ta.addEventListener("input", () => { remember(); grow(ta); });
      ta.addEventListener("keyup", remember);
      ta.addEventListener("click", remember);
      ta.addEventListener("keydown", keys);
      return;
    }

    /* WYSIWYG: the document IS the prose — same face, size and measure as the
       reading view. Markdown stays the file format; it is serialized on every
       keystroke so the draft survives a background re-render. */
    const doc = wrap.querySelector(".md-doc");
    try {
      document.execCommand("defaultParagraphSeparator", false, "p");
      document.execCommand("styleWithCSS", false, false);
    } catch { /* older engines still edit, they just tag differently */ }
    doc.innerHTML = mdToHtml(draft.text) || "<p><br></p>";
    doc.focus();
    setCaret(doc, draft.sel);

    const tools = [...wrap.querySelectorAll("[data-md]")];
    const blockSel = wrap.querySelector("#mdBlock");
    const exec = (cmd, arg = null) => document.execCommand(cmd, false, arg);
    const remember = () => { draft.text = htmlToMd(doc); draft.sel = caretOffset(doc); count(); };
    const nodeAt = () => {
      const sel = getSelection();
      const n = sel && sel.anchorNode;
      return n ? (n.nodeType === 1 ? n : n.parentElement) : null;
    };
    const within = tag => {
      const el = nodeAt()?.closest?.(tag);
      return el && doc.contains(el) ? el : null;
    };

    // Chrome's insertHTML flattens <code> into a styled <span>, so this one
    // command works the range directly. The trade-off is that the browser's
    // own undo does not record it — every other command still goes through
    // execCommand and stays undoable.
    const toggleCode = () => {
      const sel = getSelection();
      if (!sel.rangeCount) return;
      const code = within("code");
      if (code) {
        const parent = code.parentNode;
        const frag = document.createDocumentFragment();
        while (code.firstChild) frag.appendChild(code.firstChild);
        parent.replaceChild(frag, code);
        parent.normalize();
        return;
      }
      const r = sel.getRangeAt(0);
      const el = document.createElement("code");
      if (r.collapsed) el.textContent = t("ui.scene.md_code_ph");
      else el.appendChild(r.extractContents());
      r.insertNode(el);
      const after = document.createRange();
      after.selectNodeContents(el);
      sel.removeAllRanges();
      sel.addRange(after);
    };

    // The address is asked for in the studio's own popover, positioned at the
    // selection — the same shape the inline comments use.
    const makeLink = () => {
      const sel = getSelection();
      const here = within("a");
      const saved = sel.rangeCount ? sel.getRangeAt(0).cloneRange() : null;
      const rect = saved && !saved.collapsed
        ? saved.getBoundingClientRect() : doc.getBoundingClientRect();
      const pop = $("#linkPopover"), input = $("#linkUrl");
      const label = here ? here.textContent : sel.toString().trim();

      pop.querySelector(".quote").textContent = label || t("ui.scene.md_link_new");
      input.value = here?.getAttribute("href") || "";
      input.placeholder = "https://";
      $("#linkSave").textContent = t("ui.scene.md_link_save");
      $("#linkRemove").textContent = t("ui.scene.md_link_remove");
      $("#linkRemove").hidden = !here;
      $("#linkCancel").textContent = t("ui.scene.edit_cancel");
      pop.style.display = "block";
      placePopover(pop, rect);
      input.focus();
      input.select();

      const restore = () => {
        doc.focus();
        const s = getSelection();
        if (here) { const r = document.createRange(); r.selectNodeContents(here); s.removeAllRanges(); s.addRange(r); }
        else if (saved) { s.removeAllRanges(); s.addRange(saved); }
        return s;
      };
      const finish = fn => {
        pop.style.display = "none";
        off();
        const s = restore();
        fn(s);
        remember();
        syncTools();
      };
      const apply = () => {
        const url = input.value.trim();
        if (!url) return finish(() => { if (here) exec("unlink"); });
        finish(s => {
          if (s.isCollapsed && !here) exec("insertHTML", `<a href="${esc(url)}">${esc(url)}</a>`);
          else exec("createLink", url);
        });
      };
      const drop = () => finish(() => { if (here) exec("unlink"); });
      const cancel = () => { pop.style.display = "none"; off(); doc.focus(); if (saved) {
        const s = getSelection(); s.removeAllRanges(); s.addRange(saved); } };
      const onKey = e => {
        e.stopPropagation();                        // Esc belongs to the popover, not the page
        if (e.key === "Enter") { e.preventDefault(); apply(); }
        else if (e.key === "Escape") { e.preventDefault(); cancel(); }
      };
      const onOutside = e => { if (!e.target.closest("#linkPopover")) cancel(); };
      const off = () => {
        $("#linkSave").removeEventListener("click", apply);
        $("#linkRemove").removeEventListener("click", drop);
        $("#linkCancel").removeEventListener("click", cancel);
        input.removeEventListener("keydown", onKey);
        document.removeEventListener("mousedown", onOutside, true);
      };
      $("#linkSave").addEventListener("click", apply);
      $("#linkRemove").addEventListener("click", drop);
      $("#linkCancel").addEventListener("click", cancel);
      input.addEventListener("keydown", onKey);
      document.addEventListener("mousedown", onOutside, true);
    };

    const insertTable = () => exec("insertHTML",
      `<table><thead><tr><th>${esc(t("ui.scene.md_table_a"))}</th><th>${esc(t("ui.scene.md_table_b"))}</th></tr></thead>`
      + `<tbody><tr><td><br></td><td><br></td></tr><tr><td><br></td><td><br></td></tr></tbody></table><p><br></p>`);

    const act = key => {
      if (key === "hr") return exec("insertHTML", '<hr class="scene-break"><p><br></p>');
      if (key === "ul") return exec("insertUnorderedList");
      if (key === "ol") return exec("insertOrderedList");
      if (key === "code") return toggleCode();
      if (key === "link") return makeLink();
      if (key === "table") return insertTable();
      return exec(key);                              // bold | italic | strikeThrough
    };

    const syncTools = () => {
      tools.forEach(btn => {
        const cmd = btn.dataset.md;
        let on = false;
        try {
          if (cmd === "code") on = !!within("code");
          else if (cmd === "ul") on = document.queryCommandState("insertUnorderedList");
          else if (cmd === "ol") on = document.queryCommandState("insertOrderedList");
          else if (cmd === "link") on = !!within("a");
          else if (cmd !== "hr" && cmd !== "table") on = document.queryCommandState(cmd);
        } catch { /* the engine does not know this command; leave the button plain */ }
        btn.classList.toggle("on", on);
      });
      if (!blockSel) return;
      let block = "p";
      try { block = (document.queryCommandValue("formatBlock") || "p").toLowerCase(); } catch {}
      if (within("blockquote")) block = "blockquote";
      else if (within("pre")) block = "pre";
      blockSel.value = [...blockSel.options].some(o => o.value === block) ? block : "p";
    };

    doc.addEventListener("input", remember);
    doc.addEventListener("keyup", () => { draft.sel = caretOffset(doc); syncTools(); });
    doc.addEventListener("mouseup", syncTools);
    doc.addEventListener("keydown", e => {
      // Tab nests a list item rather than leaving the document
      if (e.key === "Tab" && within("li")) {
        e.preventDefault();
        exec(e.shiftKey ? "outdent" : "indent");
        remember();
        return;
      }
      keys(e);
    });
    doc.addEventListener("paste", e => {
      e.preventDefault();
      const cd = e.clipboardData;
      const html = cd.getData("text/html");
      // through markdown and back: whatever was on the clipboard arrives as
      // prose in this grammar, and nothing else comes with it
      const md = html
        ? htmlToMd(new DOMParser().parseFromString(html, "text/html").body)
        : cd.getData("text/plain");
      if (!md) return;
      const frag = mdToHtml(md);
      const single = /^<p>(?:(?!<\/p>)[\s\S])*<\/p>$/.test(frag);
      exec("insertHTML", single ? frag.replace(/^<p>/, "").replace(/<\/p>$/, "") : frag);
      remember();
    });
    tools.forEach(btn => btn.addEventListener("mousedown", e => {
      e.preventDefault();                            // the selection must stay in the document
      doc.focus();
      act(btn.dataset.md);
      remember();
      syncTools();
    }));
    blockSel?.addEventListener("change", () => {
      doc.focus();
      exec("formatBlock", "<" + blockSel.value + ">");
      remember();
      syncTools();
    });
    syncTools();
    return;
  }

  wrap.querySelector(".v-edit").addEventListener("click", async () => {
    if (!(key in S.variantTexts)) {

        S.variantTexts[key] = d.text;

  wrap.querySelectorAll(".cmt-del").forEach(btn =>

    }));

  wrap.querySelector(".cmt-rewrite")?.addEventListener("click", async () => {

      const {job} = await api("/api/revise", {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({scene: sceneName, file, provider: currentProvider().name})});

        if (j.status === "error") showToast(t("ui.scene.gen_fail", {name: sceneName, e: j.error}), "err");
        if (j.status !== "running") { S.variantTexts = {}; await load(); }
      });
      await load();
    } catch (e) { showToast(t("ui.scene.gen_start_fail", {e: e.message}), "err"); }
  });

  if (!(key in S.variantTexts)) {
    try {
      const d = await api(`/api/variant?scene=${encodeURIComponent(sceneName)}&file=${encodeURIComponent(file)}`);
      S.variantTexts[key] = d.text;
    } catch (e) { S.variantTexts[key] = t("ui.scene.read_fail", {e: e.message}); }
  }
  const box = wrap.querySelector(".variant-text");
  if (box) paintVariantText(box, S.variantTexts[key], v.comments);
}

/* The reading view renders the same markdown subset, so emphasis the agent set
   reads as emphasis instead of asterisks. Comment quotes are then matched over
   the rendered text and wrapped in place — a quote may run through <em> or a
   line break, so the highlight walks text nodes rather than the raw string. */
function paintVariantText(box, text, comments) {
  box.innerHTML = mdToHtml(text);
  for (const c of comments || []) {
    if (!c.quote) continue;
    const title = String(c.note ?? "").replace(/\s+/g, " ");
    // a quote that spans a paragraph break is matched part by part
    for (const part of String(c.quote).split(/\n[ \t]*\n+/)) {
      const needle = part.trim();
      if (needle.length < 3) continue;
      for (const block of box.children) if (markQuote(block, needle, title)) break;
    }
  }
}

function markQuote(block, needle, title) {
  const spans = [];       // [textNode | null (a <br>), start offset]
  let text = "";
  const walk = document.createTreeWalker(block, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
  for (let n = walk.nextNode(); n; n = walk.nextNode()) {
    if (n.nodeType === 1) { if (n.nodeName === "BR") { spans.push([null, text.length]); text += "\n"; } continue; }
    if (n.parentElement.closest("mark.cmt")) continue;   // never nest highlights
    spans.push([n, text.length]);
    text += n.nodeValue;
  }
  const at = text.indexOf(needle);
  if (at < 0) return false;
  const end = at + needle.length;
  // back to front, so the offsets of the earlier nodes stay valid
  for (let i = spans.length - 1; i >= 0; i--) {
    const [node, start] = spans[i];
    if (!node) continue;
    const from = Math.max(at, start), to = Math.min(end, start + node.nodeValue.length);
    if (from >= to) continue;
    const range = document.createRange();
    range.setStart(node, from - start);
    range.setEnd(node, to - start);
    const mark = document.createElement("mark");
    mark.className = "cmt";
    mark.title = title;
    range.surroundContents(mark);
  }
  return true;
}

async function generateScene(name, instruction = "", commentsFrom = null) {

}

function builderModel() {
  if (!B.model || !B.dirty) {
    const strip = n => {
      if (Array.isArray(n)) return n.map(strip);
      if (n && typeof n === "object")
        return Object.fromEntries(Object.entries(n).filter(([k]) => k !== "_line")
          .map(([k, v]) => [k, strip(v)]));
      return n;
    };
    const book = S.project?.result?.book;
    B.model = book ? strip(book) : {
      title: t("seed.book"),
      settings: {voice: "third_person_limited", tense: "past", language: S.lang || "uk", style_profile: ""},
      world: null, characters: [], locations: [], threads: [], acts: [],
    };
    B.model.locations = B.model.locations || [];
    B.model.threads = B.model.threads || [];
    // remember original scene names so a rename can migrate variants/memory
    for (const a of B.model.acts || [])
      for (const c of a.chapters || [])
        for (const sc of c.scenes || []) sc._orig = sc.name;
    B.dirty = false;
  }
  return B.model;
}

const getPath = (obj, path) => path.split(".").reduce((o, k) => o?.[k], obj);
function setPath(obj, path, val) {
  const keys = path.split(".");
  const last = keys.pop();
  let target = obj;
  for (let i = 0; i < keys.length; i++) {
    const k = keys[i];
    const next = i + 1 < keys.length ? keys[i + 1] : last;  // container type = next key's shape
    if (target[k] == null) target[k] = /^\d+$/.test(next) ? [] : {};
    target = target[k];
  }
  target[last] = val;
}

/* ---------- settings advisor: notes + graph -> suggested settings ---------- */
function advItemHtml(it, readOnly) {
  if (it.scope === "note")
    return `<div class="adv-item note ${esc(it.level)}"><div class="why">${esc(it.reason)}</div></div>`;
  const label = t("advisor.key." + it.key);
  const shown = v => v === null || v === undefined || v === "" ? t("advisor.unset") : String(v);
  // In the draft dialog there is no book yet, so "current" is meaningless:
  // show what the new book will be created with, and nothing to click.
  const value = readOnly ? `<b>${esc(shown(it.suggested))}</b>`
    : it.changes ? `<s>${esc(shown(it.current))}</s> → <b>${esc(shown(it.suggested))}</b>`
    : `<b>${esc(shown(it.current))}</b>`;
  const apply = !readOnly && it.changes && it.scope === "settings"
    ? `<button data-adv-apply="${esc(it.key)}">${esc(t("advisor.apply"))}</button>` : "<span></span>";
  return `<div class="adv-item ${esc(readOnly ? "info" : it.changes ? it.level : "ok")}">
    <span class="k">${esc(label)}</span><span class="v">${value}</span>${apply}
    <div class="why">${esc(it.reason)}</div></div>`;
}

function advisorHtml() {
  const a = B.advice;
  const head = `<div class="adv-hdr"><span class="t">${esc(t("advisor.hdr"))}</span>
    <span class="sp"></span>
    <button data-adv-refresh="1">↻</button>
    ${a?.items?.some(i => i.changes)
      ? `<button class="primary" data-adv-apply-all="1">${esc(t("advisor.apply_all"))}</button>` : ""}
  </div>`;
  if (a === undefined) return head + `<div class="adv-hint">…</div>`;
  if (!a || !a.items?.length) return head + `<div class="adv-hint">${esc(t("advisor.none"))}</div>`;
  // the estimate the rules actually used, not the raw paragraph count
  const n = a.shape?.notes ? a.scenes : null;
  const hint = n ? t("advisor.hint") + " " + t("advisor.scenes_est", {n}) : t("advisor.hint");
  return head + `<div class="adv-hint">${esc(hint)}</div>` + a.items.map(advItemHtml).join("");
}

async function loadAdvice(force) {
  if (B.adviceLoading) return;
  if (B.advice !== undefined && !force) return;
  B.adviceLoading = true;
  if (force) { B.advice = undefined; renderBuilder(); }
  try {
    B.advice = await api("/api/advise", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({book: B.model})});
  } catch (e) { B.advice = null; }
  B.adviceLoading = false;
  renderBuilder();
}

function applyAdvice(keys) {
  const a = B.advice;
  if (!a) return;
  B.model.settings = B.model.settings || {};
  for (const it of a.items) {
    if (it.scope !== "settings" || !it.changes) continue;
    if (keys && !keys.includes(it.key)) continue;
    B.model.settings[it.key] = it.suggested;
  }
  B.dirty = true;
  B.advice = undefined;          // the graph changed — renderBuilder re-asks
  showToast(t("advisor.applied"), "ok");
  renderBuilder();
  schedulePreview();
}

function sceneCount(m) {
  let n = 0;
  for (const a of m.acts || []) for (const c of a.chapters || []) n += (c.scenes || []).length;
  return n;
}

function coerce(el) {
  const v = el.type === "checkbox" ? el.checked : el.value;
  switch (el.dataset.type) {
    case "number": return v === "" ? null : Math.round(Number(v));
    case "float": return Number(v);
    case "csv": return String(v).split(",").map(s => s.trim()).filter(Boolean);
    default: return v === "" ? (el.tagName === "SELECT" ? null : "") : v;
  }
}

function bindBuilder(pane) {
  if (pane.dataset.builderBound) return;  // pane persists across renders — bind once
  pane.dataset.builderBound = "1";
  pane.addEventListener("toggle", e => {
    const key = e.target.dataset?.acc;
    if (!key) return;
    if (e.target.open) B.closed.delete(key); else B.closed.add(key);
  }, true);
  pane.addEventListener("input", e => {
    const el = e.target;
    if (el.dataset.bind) {
      setPath(B.model, el.dataset.bind, coerce(el));
      if (el.type === "range") el.parentElement.querySelector(".tval").textContent = Number(el.value).toFixed(2);
      B.dirty = true;
      const st = $("#bStatus"); if (st) st.textContent = t("ui.builder.unsaved");
      schedulePreview();
    }
  });
  pane.addEventListener("change", e => {
    const el = e.target;
    if (el.dataset.list) {
      const list = getPath(B.model, el.dataset.list) || [];
      const item = el.dataset.item;
      setPath(B.model, el.dataset.list,
        el.checked ? [...new Set([...list, item])] : list.filter(x => x !== item));
      B.dirty = true;
      schedulePreview();
    }
  });
  pane.addEventListener("click", e => {
    const el = e.target.closest("button");
    if (!el) return;
    if (el.dataset.advRefresh) { loadAdvice(true); }
    else if (el.dataset.advApplyAll) { applyAdvice(null); }
    else if (el.dataset.advApply) { applyAdvice([el.dataset.advApply]); }
    else if (el.dataset.addWorld) { B.model.world = NEW.world(); B.dirty = true; renderBuilder(); }
    else if (el.dataset.delWorld) { B.model.world = null; B.dirty = true; renderBuilder(); }
    else if (el.dataset.add) {
      const list = getPath(B.model, el.dataset.add) || [];
      const item = el.dataset.kind === "str" ? "" :
                   el.dataset.kind === "tension" ? 0.5 : NEW[el.dataset.kind]();
      setPath(B.model, el.dataset.add, [...list, item]);
      B.dirty = true; renderBuilder();
    }
    else if (el.dataset.del) {
      const keys = el.dataset.del.split(".");
      const idx = Number(keys.pop());
      const list = getPath(B.model, keys.join("."));
      if (Array.isArray(list)) list.splice(idx, 1);
      B.dirty = true; renderBuilder();
    }
    else if (el.id === "bSave") saveBuilder();
    else if (el.id === "wizOpen") openWizard();
  });
}

function schedulePreview(delay = 450) {
  clearTimeout(B.timer);
  B.timer = setTimeout(async () => {
    try {
      const d = await api("/api/construct", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({book: B.model})});
      B.src = d.source; B.diags = d.result.diagnostics;
      const pre = $("#bSrc"); if (pre) pre.textContent = d.source;
      const dg = $("#bDiags");
      if (dg) {
        dg.innerHTML = B.diags.length ? B.diags.map(x => `
          <div class="diag ${esc(x.severity)}"><span class="code">${esc(x.code)}</span>
          <span>${esc(x.message)}${x.hint ? ` <span class="hint">${esc(x.hint)}</span>` : ""}</span></div>`).join("")
          : `<div class="diags-clean">${esc(t("ui.builder.valid"))}</div>`;
      }
      syncDiagsFold();
    } catch (e) {
      const dg = $("#bDiags");
      if (dg) dg.innerHTML = `<div class="diag error"><span class="code">UI</span><span>${esc(e.message)}</span></div>`;
    }
  }, delay);
}

function syncDiagsFold() {
  const wrap = $("#bDiagsWrap"), sum = $("#bDiagsSum");
  if (!wrap || !sum) return;
  const errs = B.diags.filter(x => x.severity === "error").length;
  const warns = B.diags.length - errs;
  const parts = [];
  if (errs) parts.push(tn("ui.builder.errors_n", errs));
  if (warns) parts.push(tn("ui.builder.warnings_n", warns));
  sum.textContent = parts.length ? parts.join(" · ") : t("ui.builder.valid");
  // A long book carries dozens of warnings; showing them all would bury the
  // form under a sticky footer. Auto-open only a short list or real errors —
  // once the author toggles it by hand, their choice sticks.
  wrap.open = B.diagsOpen !== undefined ? B.diagsOpen
            : (errs > 0 || B.diags.length <= 3);
  if (!wrap.dataset.bound) {
    wrap.dataset.bound = "1";
    wrap.addEventListener("toggle", () => { B.diagsOpen = wrap.open; });
  }
}

async function saveBuilder() {
  try {
    const renames = [];
    for (const a of B.model.acts || [])
      for (const c of a.chapters || [])
        for (const sc of c.scenes || [])
          if (sc._orig && sc.name && sc._orig !== sc.name) renames.push({from: sc._orig, to: sc.name});
    const d = await api("/api/construct", {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({book: B.model, save: true, renames})});
    B.dirty = false;
    S.editorDraft = null;
    showToast(d.result.ok ? t("ui.builder.saved_ok") : t("ui.builder.saved_warn"),
              d.result.ok ? "ok" : "err");
    await load(false);
    setTab("builder");
  } catch (e) { showToast(t("ui.builder.save_fail", {e: e.message}), "err"); }
}

  if (!BD.model || !BD.dirty) {
    const strip = n => {
      if (Array.isArray(n)) return n.map(strip);
      if (n && typeof n === "object")
        return Object.fromEntries(Object.entries(n).filter(([k]) => k !== "_line")
          .map(([k, v]) => [k, strip(v)]));
      return n;
    };
    const book = S.project?.result?.book;
    BD.model = book ? strip(book) : null;
    BD.dirty = false;
  }
  return BD.model;
}

function sceneWords(name) {
  const st = sceneState(name);
  let file = st.approved;
  const variants = st.variants || {};
  if (!file && Object.keys(variants).length === 1) file = Object.keys(variants)[0];
  return file ? (variants[file]?.words ?? variants[file]?.critique?.word_count_estimate) : null;
}

function renderBoard() {
  const pane = $("#pane");
  const m = boardModel();
  if (!m || !sceneCount(m)) {
    pane.innerHTML = `<div class="empty-state">

      <button class="primary" onclick="setTab('builder')">${esc(t("ui.scene.open_builder"))}</button>
    </div>`;
    return;
  }
  const threadNames = (m.threads || []).map(th => th.name).filter(Boolean);
  const tcolor = name => THREAD_COLORS[threadNames.indexOf(name) % THREAD_COLORS.length];

  let html = `<div class="board-bar">
    <button class="primary" id="boardSave" ${BD.dirty ? "" : "disabled"}>${esc(t("ui.board.save"))}</button>
    <span class="note">${BD.dirty ? esc(t("ui.board.unsaved")) : esc(t("ui.board.hint"))}</span>

        <span class="ttl">${esc(ch.title || "")}</span></div>

            <div class="bc-name">${esc(sc.name)}</div>

            <div class="bc-meta">
              ${sc.pov ? `<span class="pov">${esc(sc.pov)}</span>` : ""}
              ${words ? `<span>${esc(t("ui.board.words", {n: words}))}</span>` : ""}
              <span title="${esc(t("ui.status." + st))}">${statusDot(st)}</span>
              ${(sc.threads || []).length ? `<span class="bc-threads">${sc.threads.map(th =>
                `<span class="thread-chip" style="background:${tcolor(th)}" title="${esc(th)}"></span>`).join("")}</span>` : ""}
            </div>
          </div>`;
        }).join("")}
      </div>
    </div>`;
  }));

  // thread map: rows = threads, columns = scenes in narrative order
  html += `<div class="tmap-wrap">
    <div class="rail-label" style="padding:0 0 6px">${esc(t("ui.board.threads_hdr"))}</div>`;
  if (!threadNames.length) {
    html += `<div class="rail-empty" style="padding:4px 0">${esc(t("ui.board.no_threads"))}</div></div>`;
  } else {
    const flat = [];
    for (const a of m.acts || []) for (const ch of a.chapters || []) for (const sc of ch.scenes || []) flat.push(sc);
    html += `<div class="vp-hint" style="margin-bottom:8px">${esc(t("ui.board.threads_hint"))}</div>
      <div class="tmap-scroll"><table class="tmap">
      <thead><tr><th class="rowh"></th>${flat.map((sc, i) =>
        `<th title="${esc(sc.name)}">${i + 1}</th>`).join("")}</tr></thead>
      <tbody>${threadNames.map(name => `<tr>
        <th class="rowh"><span class="thread-chip" style="background:${tcolor(name)};display:inline-block;margin-right:7px"></span>${esc(name)}</th>
        ${flat.map(sc => `<td title="${esc(sc.name)}">${(sc.threads || []).includes(name)
          ? `<span class="tmap-dot" style="background:${tcolor(name)}"></span>`
          : `<span class="tmap-dash">·</span>`}</td>`).join("")}
      </tr>`).join("")}</tbody>
    </table></div></div>`;
  }
  pane.innerHTML = html;
  bindBoard(pane, m);
}

function bindBoard(pane, m) {
  const chapterOf = (ai, ci) => m.acts[ai].chapters[ci];
  let drag = null;  // {from: [ai,ci,si]}

  pane.querySelectorAll(".board-card").forEach(card => {
    card.addEventListener("dragstart", e => {
      drag = card.dataset.pos.split(".").map(Number);
      card.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
    });
    card.addEventListener("dragend", () => { drag = null; card.classList.remove("dragging"); });
    card.addEventListener("click", () => {
      if (drag) return;
      const [ai, ci, si] = card.dataset.pos.split(".").map(Number);
      S.scene = chapterOf(ai, ci).scenes[si].name;
      setTab("scene");
    });
    card.addEventListener("dragover", e => { e.preventDefault(); });
    card.addEventListener("drop", e => {
      e.preventDefault(); e.stopPropagation();
      if (!drag) return;
      const to = card.dataset.pos.split(".").map(Number);
      moveScene(m, drag, to);
    });
  });
  pane.querySelectorAll(".board-row").forEach(row => {
    row.addEventListener("dragover", e => { e.preventDefault(); row.classList.add("dragover"); });
    row.addEventListener("dragleave", () => row.classList.remove("dragover"));
    row.addEventListener("drop", e => {
      e.preventDefault();
      row.classList.remove("dragover");
      if (!drag) return;
      const [ai, ci] = row.dataset.row.split(".").map(Number);
      moveScene(m, drag, [ai, ci, chapterOf(ai, ci).scenes.length]);
    });
  });
  $("#boardSave")?.addEventListener("click", async () => {
    try {
      const d = await api("/api/construct", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({book: BD.model, save: true})});
      BD.dirty = false;
      B.model = null; B.dirty = false;  // builder re-reads the saved order
      showToast(d.result.ok ? t("ui.board.saved") : t("ui.builder.saved_warn"),
                d.result.ok ? "ok" : "err");
      await load(false);
      setTab("board");
    } catch (e) { showToast(t("ui.board.save_fail", {e: e.message}), "err"); }
  });
}

function moveScene(m, from, to) {
  const [fa, fc, fs] = from;
  const scene = m.acts[fa].chapters[fc].scenes.splice(fs, 1)[0];
  let [ta, tc, ts] = to;
  if (fa === ta && fc === tc && fs < ts) ts -= 1;  // removal shifted the target left
  m.acts[ta].chapters[tc].scenes.splice(ts, 0, scene);
  BD.dirty = true;
  renderBoard();
}

/* ---------- stats tab ---------- */
function barChart(items, {height = 190, barW = 26, gap = 8, color = "var(--sage)"} = {}) {
  if (!items.length) return "";
  const max = Math.max(...items.map(i => i.value), 1);
  const chartH = height - 40;
  const w = items.length * (barW + gap) + gap;
  const bars = items.map((it, i) => {
    const h = Math.max(2, Math.round(it.value / max * chartH));
    const x = gap + i * (barW + gap);
    const y = chartH - h + 14;
    return `<g>
      <title>${esc(it.label)}: ${it.value}</title>
      <rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="3" fill="${it.color || color}" opacity="${it.dim ? .45 : .9}"></rect>
      <text x="${x + barW / 2}" y="${y - 4}" text-anchor="middle" font-size="9" fill="var(--faint)" font-family="var(--mono)">${it.value >= 1000 ? (it.value/1000).toFixed(1) + "k" : it.value}</text>
      <text x="${x + barW / 2}" y="${height - 12}" text-anchor="middle" font-size="8.5" fill="var(--faint)" font-family="var(--mono)">${esc(String(it.label).slice(0, 6))}</text>
    </g>`;
  }).join("");
  return `<svg width="${w}" height="${height}" role="img">${bars}</svg>`;
}

/* ---------- new project from raw notes: the agent fills the whole book ---------- */
function openDraftModal() {
  hideProjMenu();
  const providers = S.project?.providers || [];
  const D = {dir: "", lang: S.lang || "uk", notes: "", provider: currentProvider().name || ""};
  const div = document.createElement("div");
  div.className = "wiz-backdrop"; div.id = "draftB";
  div.innerHTML = `<div class="wiz">
    <div class="wz-step">${esc(t("ui.draft.title"))}</div>
    <div class="wz-hint">${esc(t("ui.draft.hint"))}</div>
    <div class="b-row">${txt(t("ui.draft.dir"), "d.dir", D.dir, "b-grow", "text", t("ui.projects.dir_ph"))}
      ${txt(t("ui.draft.lang"), "d.lang", D.lang, "b-w-sm")}
      ${fld(t("ui.header.model"), `<select data-bind="d.provider">${providers.map(p =>
        `<option value="${esc(p.name)}" ${p.name === D.provider ? "selected" : ""}>` +
        `${esc(p.name)}${p.model ? " · " + esc(p.model) : ""}` +
        `${p.available ? "" : " " + esc(t("ui.header.unavailable"))}</option>`).join("")}</select>`)}</div>
    <div class="b-row">${fld(t("ui.draft.notes"),
      `<textarea data-bind="d.notes" rows="12" placeholder="${esc(t("ui.draft.notes_ph"))}"></textarea>`)}</div>
    <div id="dAdvice"></div>
    <div class="wz-nav">
      <button id="dCancel">${esc(t("ui.wizard.cancel"))}</button>
      <span class="sp"></span>
      <button class="primary" id="dCreate">${esc(t("ui.draft.create"))}</button>
    </div>
  </div>`;
  document.body.appendChild(div);
  let tick = null;  // live progress refresh while the job runs
  const stopTick = () => { if (tick) { clearInterval(tick); tick = null; } };
  const dismiss = () => {  // during a run the modal hides, the job keeps going
    stopTick();
    div.remove();
    if (div.dataset.running) showToast(t("ui.draft.started"), "ok");
  };

  // advice on the notes as they are pasted: deterministic, so it can run often
  let adviceTimer = null, advice = null;
  const renderAdvice = () => {
    const box = div.querySelector("#dAdvice");
    if (!box) return;
    if (!advice?.items?.length) { box.innerHTML = ""; return; }
    box.innerHTML = `<div class="adv-hdr"><span class="t">${esc(t("advisor.hdr"))}</span></div>`
      + `<div class="adv-hint">${esc(t("advisor.scenes_est", {n: advice.scenes ?? 0}))}</div>`
      + advice.items.filter(i => i.scope === "settings").map(i => advItemHtml(i, true)).join("");
  };
  const refreshAdvice = () => {
    clearTimeout(adviceTimer);
    adviceTimer = setTimeout(async () => {
      const notes = D.notes.trim();
      if (notes.length < 200) { advice = null; renderAdvice(); return; }
      try {
        advice = await api("/api/advise", {method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({notes, notes_only: true})});
      } catch (e) { advice = null; }
      renderAdvice();
    }, 400);
  };

  const bind = e => {
    const b = e.target.dataset?.bind;
    if (!b?.startsWith("d.")) return;
    D[b.slice(2)] = e.target.value;
    if (b === "d.notes") refreshAdvice();
  };
  div.addEventListener("input", bind);
  div.addEventListener("change", bind);  // <select> in older engines only fires change
  div.addEventListener("click", async e => {
    if (e.target === div || e.target.id === "dCancel" || e.target.id === "dHide") { dismiss(); return; }
    if (e.target.id !== "dCreate") return;
    const dir = D.dir.trim(), notes = D.notes.trim();
    if (!dir || !notes) { showToast(t("ui.draft.need_both"), "err"); return; }
    const btn = e.target;
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span> ${esc(t("ui.draft.starting"))}`;
    try {
      const d = await api("/api/project/draft", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({directory: dir, notes, lang: D.lang.trim() || "uk",
                              provider: D.provider || null,
                              settings: advice?.settings || null})});
      div.dataset.running = "1";
      div.querySelector(".wiz").innerHTML = `
        <div class="wz-step">${esc(t("ui.draft.title"))}</div>
        <h2 class="wz-working"><span class="spinner"></span>${esc(t("ui.draft.working_hdr"))}</h2>
        <div class="wz-hint">${esc(t("ui.draft.working"))}</div>
        <div class="dp-box" id="draftProg"><div class="dp-line">…</div></div>
        <div class="wz-nav"><span class="sp"></span>
          <button id="dHide">${esc(t("ui.draft.hide"))}</button></div>`;
      tick = setInterval(async () => {
        try {
          const jd = await api("/api/jobs");
          const j = jd.jobs.find(x => x.id === d.job.id);
          const box = div.querySelector("#draftProg");
          if (j && box && j.progress.length)
            box.innerHTML = j.progress.slice(-8).map(m => `<div class="dp-line">${esc(m)}</div>`).join("");
        } catch {}
      }, 1500);
      watchJobs(d.job.id, async j => {
        stopTick();
        div.remove();
        if (j.status !== "done") { showToast(t("ui.draft.fail", {e: j.error || "?"}), "err"); return; }
        try {
          await api("/api/project/open", {method: "POST", headers: {"Content-Type": "application/json"},
            body: JSON.stringify({file: j.result.file})});
          resetProjectState();
          await load(false);
          showToast(t("ui.draft.done", {title: j.result.title}), "ok");
          setTab("board");
        } catch (err) { showToast(t("ui.projects.switch_fail", {e: err.message}), "err"); }
      });
    } catch (err) {
      btn.disabled = false;
      btn.textContent = t("ui.draft.create");
      showToast(t("ui.draft.fail", {e: err.message}), "err");
    }
  });
}

function hideProjMenu() { $("#projMenu").style.display = "none"; }
$("#projBtn").addEventListener("click", async e => {
  const menu = $("#projMenu");
  if (menu.style.display === "block") return hideProjMenu();
  await renderProjMenu();

function renderWizard() {

  if (W.step === 1) {
    body = `

      </div>`).join("")}

  } else {
    const stages = tpl => tpl.acts.reduce((n, a) => n + (a.scenes || []).length, 0);
    body = `
      <h2>${esc(t("ui.wizard.s3_title"))}</h2>
      <div class="wz-hint">${esc(t("ui.wizard.s3_hint"))}</div>
      <div class="wiz-tpl">
        <div class="tplc ${W.tplId === null ? "sel" : ""}" data-tpl="">
          <div class="tn">∅</div><div class="td">${esc(t("ui.wizard.s3_none"))}</div></div>
        ${W.templates.map(tpl => `<div class="tplc ${W.tplId === tpl.id ? "sel" : ""}" data-tpl="${esc(tpl.id)}">
          <div class="tn">${esc(tpl.name)}</div>
          <div class="td">${esc(tpl.desc)}</div>
          <div class="ts">${esc(t("ui.wizard.s3_stages", {n: stages(tpl), a: tpl.acts.length}))}</div>
        </div>`).join("")}
      </div>`;
  }
  const div = document.createElement("div");
  div.className = "wiz-backdrop"; div.id = "wizB";
  div.innerHTML = `<div class="wiz">
    <div class="wz-step">${esc(t("ui.wizard.title"))} — ${esc(t("ui.wizard.step", {n: W.step, total}))}</div>
    ${body}
    <div class="wz-nav">
      <button id="wCancel">${esc(t("ui.wizard.cancel"))}</button>
      <span class="sp"></span>
      ${W.step > 1 ? `<button id="wBack">${esc(t("ui.wizard.back"))}</button>` : ""}
      ${W.step < total ? `<button class="primary" id="wNext">${esc(t("ui.wizard.next"))}</button>`
                       : `<button class="primary" id="wFinish">${esc(t("ui.wizard.finish"))}</button>`}
    </div>
  </div>`;
  document.body.appendChild(div);

  div.addEventListener("input", e => {
    const b = e.target.dataset?.bind;
    if (!b) return;
    if (b.startsWith("w.")) W.data[b.slice(2)] = e.target.value;
    else if (b.startsWith("wc.")) {
      const [, i, k] = b.split(".");
      W.chars[+i][k] = e.target.value;

    const el = e.target.closest("button, .tplc");

    if (el.id === "wCancel") closeWizard();

    else if (el.id === "wAddChar") { W.chars.push({name: "", arc: "", wants: "", fears: ""}); renderWizard(); }
    else if (el.dataset?.wdel != null) { W.chars.splice(+el.dataset.wdel, 1); renderWizard(); }
    else if (el.classList?.contains("tplc")) { W.tplId = el.dataset.tpl || null; renderWizard(); }
    else if (el.id === "wFinish") finishWizard();
  });

/* ---------- manuscript tab (original + translations) ---------- */
function msLangChips(tr) {
  const items = (tr.translations || []).slice();
  if (S.msLang && !items.some(x => x.lang === S.msLang))
    items.push({lang: S.msLang, language: S.msLang, done: 0, stale: 0, missing: 0, total: 0});
  const chip = x => {
    const attention = x.stale > 0 || x.missing > 0;
    const st = x.total ? `<span class="st">${x.done}/${x.total}</span>` : "";
    return `<button class="lang-chip ${S.msLang === x.lang ? "active" : ""} ${attention ? "stale" : ""}"
      data-tr="${esc(x.lang)}" title="${esc(x.language || x.lang)}">${esc(x.lang)}${st}</button>`;
  };
  return `<div class="ms-langs">
    <button class="lang-chip ${S.msLang ? "" : "active"}" data-tr="">${esc(t("ui.manuscript.original"))}${tr.book_lang ? " · " + esc(tr.book_lang) : ""}</button>
    ${items.map(chip).join("")}
    <input class="lang-new" id="msNewLang" placeholder="${esc(t("ui.manuscript.add_lang_ph"))}" spellcheck="false" maxlength="8">
    <button id="msAddLang">${esc(t("ui.manuscript.translate_btn"))}</button>
  </div>`;
}

function bindMsLangs(pane) {
  pane.querySelectorAll(".lang-chip").forEach(b => b.addEventListener("click", () => {
    S.msLang = b.dataset.tr || null;
    renderManuscript();
  }));
  const start = () => {
    const code = $("#msNewLang").value.trim().toLowerCase();
    if (!/^[a-z]{2,3}(-[a-z0-9]{2,8})?$/.test(code)) { showToast(t("ui.manuscript.bad_lang"), "err"); return; }
    startTranslation(code);
  };
  $("#msAddLang")?.addEventListener("click", start);
  $("#msNewLang")?.addEventListener("keydown", e => { if (e.key === "Enter") start(); });
}

async function startTranslation(code, force = false) {
  try {
    const d = await api("/api/translate", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({lang: code, provider: currentProvider().name, force})});
    S.msLang = code;
    showToast(t("ui.manuscript.tr_started"), "ok");
    watchJobs(d.job.id, j => {
      if (j.status === "done") showToast(t("ui.manuscript.tr_done_toast"), "ok");
      else showToast(t("ui.manuscript.tr_fail", {e: j.error || "?"}), "err");
      if (S.tab === "manuscript") renderManuscript();
    });
    if (S.tab === "manuscript") renderManuscript();

}

function translateRunning(code) {
  return (S.project?.jobs || []).some(j =>
    j.kind === "translate" && j.scene === code && j.status === "running");
}

/* The manuscript reads by structure, not as one wall of prose: act and chapter
   headings, and above each scene a slug line saying where and when it happens.
   `ms.text` stays the flat prose that copy, the .md download and the EPUB use —
   the slugs are a reading aid for the author, not part of the book. */
function msBody(ms) {
  const chapters = ms.chapters || [];
  if (!chapters.length) return mdToHtml(ms.text);
  const manyActs = new Set(chapters.map(c => c.act)).size > 1;
  let act = null;
  return chapters.map(ch => {
    const actHdr = manyActs && ch.act !== act
      ? `<div class="ms-act">${esc(ch.act_heading)}</div>` : "";
    act = ch.act;
    let last = null;
    const scenes = ch.scenes.map((sc, i) => {
      const where = [sc.location, sc.time].filter(Boolean);
      const key = where.join("\u0000");
      // a scene that stays in the same place at the same time gets a plain
      // break rather than a repeated slug — but never runs into the one before
      const slug = (!where.length || key === last)
        ? (i ? `<hr class="scene-break">` : "")
        : `<div class="ms-slug">${[sc.location ? `<span class="where">${esc(sc.location)}</span>` : "",
                                   sc.time ? esc(sc.time) : ""].filter(Boolean).join(" · ")}</div>`;
      last = key;
      return slug + mdToHtml(sc.text);
    }).join("");
    return `<section>${actHdr}<h2 class="ms-h">${esc(ch.heading)}</h2>${scenes}</section>`;
  }).join("");
}

async function renderManuscript() {

  pane.innerHTML = `<div class="empty-state"><div class="glyph pulse">❧</div><p>${esc(t("ui.manuscript.loading"))}</p></div>`;

  } catch (e) { pane.innerHTML = `<div class="empty-state"><h3>${esc(t("ui.manuscript.error_title"))}</h3><p>${esc(e.message)}</p></div>`; return; }
  const running = S.msLang && translateRunning(S.msLang);

  if (!ms.text.trim()) {
    pane.innerHTML = msLangChips(tr) + (S.msLang ? `

  const status = S.msLang
    ? (running ? `<span style="color:var(--candle)">${esc(t("ui.job.translate"))}…</span>`

            <button id="msTrRun">${esc(t("ui.manuscript.update_btn"))}</button>`

    : (ms.missing.length ? `<span style="color:var(--candle)">${esc(t("ui.manuscript.missing", {list: ms.missing.join(", ")}))}</span>`
                         : `<span style="color:var(--sage)">${esc(t("ui.manuscript.complete"))}</span>`);
  pane.innerHTML = `${msLangChips(tr)}<div class="ms-wrap">
    <div class="ms-title">${esc(ms.title)}</div>
    <div class="ms-meta">
      <span>${esc(t("ui.manuscript.words", {n: words}))}</span>
      ${status}
      <button id="copyMs">${esc(t("ui.manuscript.copy"))}</button>
      <button id="dlMs">${esc(t("ui.manuscript.download"))}</button>
      <button id="dlEpub">${esc(t("ui.manuscript.epub"))}</button>
    </div>
    <div class="divider-quill">❦ ❦ ❦</div>
    <div class="ms-text prose">${msBody(ms)}</div>
  </div>`;
  bindMsLangs(pane);
  $("#msTrRun")?.addEventListener("click", () => startTranslation(S.msLang));
  $("#msTrForce")?.addEventListener("click", () => startTranslation(S.msLang, true));
  $("#copyMs").addEventListener("click", async () => {
    await navigator.clipboard.writeText(ms.text);

  });

      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
      const blob = await res.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);

      a.click();
      URL.revokeObjectURL(a.href);
    } catch (e) { showToast(t("ui.source.error", {e: e.message}), "err"); }
  });
}

/* ---------- job polling / log ---------- */
const watched = new Map();
function watchJobs(jobId, cb) {
  watched.set(jobId, cb);
  if (!S.polling) S.polling = setInterval(pollJobs, 1500);
  pollJobs();
}
async function pollJobs() {
  let data;
  try { data = await api("/api/jobs"); } catch { return; }
  S.project && (S.project.jobs = data.jobs);
  const running = data.jobs.filter(j => j.status === "running");
  renderJobLog(data.jobs);
  for (const j of data.jobs) {
    if (watched.has(j.id) && j.status !== "running") {
      const cb = watched.get(j.id); watched.delete(j.id);
      cb(j);
    }
  }
  if (!running.length && !watched.size && S.polling) {
    clearInterval(S.polling); S.polling = null;
    setTimeout(() => renderJobLog([]), 5000);
  }
}
function renderJobLog(jobs) {
  const el = $("#joblog");
  const active = jobs.filter(j => j.status === "running" || watched.has(j.id));
  const recent = active.length ? active : jobs.filter(j => j.status !== "running").slice(-1);
  if (!recent.length) { el.classList.remove("visible"); return; }
  el.classList.add("visible");
  el.innerHTML = recent.map(j => {
    const kindLabel = lookupL(L, "ui.job." + j.kind) ? t("ui.job." + j.kind) : j.kind;
    return `
    <div class="jl-title">${j.status === "running" ? '<span class="spinner"></span>' : (j.status === "done" ? "✓" : "✕")}
      ${esc(kindLabel)}${j.scene ? " · " + esc(j.scene) : ""}</div>
    ${j.progress.slice(-6).map(m => `<div class="jl-line">${esc(m)}</div>`).join("")}
    ${j.error ? `<div class="jl-err">${esc(j.error)}</div>` : ""}`;
  }).join("");
}

/* ---------- voice dictation: one floating mic serves every text field ---------- */
(() => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;  // browser without speech recognition: no mic anywhere

  const mic = document.createElement("button");
  mic.id = "micBtn"; mic.type = "button"; mic.textContent = "🎙";
  document.body.appendChild(mic);
  let field = null;  // the input/textarea the mic serves
  let rec = null;    // the active recognition session

  const editable = el => el && (el.tagName === "TEXTAREA" ||
    (el.tagName === "INPUT" && ["text", "search", ""].includes(el.type || "")));

  const place = () => {
    if (!field || !document.contains(field)) { hide(); return; }
    const r = field.getBoundingClientRect();
    if (r.bottom < 44 || r.top > innerHeight - 8 || r.width < 90) { mic.style.display = "none"; return; }
    mic.style.display = "block";
    mic.title = t(rec ? "ui.dictate.stop" : "ui.dictate.start");
    mic.style.left = (r.right - 32) + "px";
    // centered in a one-line input, tucked into the corner of a textarea
    mic.style.top = (r.height > 60 ? r.top + 6 : r.top + (r.height - 26) / 2) + "px";
  };
  const hide = () => { mic.style.display = "none"; field = null; };

  document.addEventListener("focusin", e => {
    if (editable(e.target)) { field = e.target; place(); }  // retarget even mid-dictation
  });
  document.addEventListener("focusout", () => setTimeout(() => {
    const a = document.activeElement;
    if (!rec && a !== mic && !editable(a)) hide();
  }, 60));
  addEventListener("scroll", place, true);
  addEventListener("resize", place);

  const insert = text => {
    if (!field || !text) return;
    const start = field.selectionStart ?? field.value.length;
    const end = field.selectionEnd ?? start;
    const before = field.value.slice(0, start);
    const pad = before && !/\s$/.test(before) ? " " : "";
    field.value = before + pad + text + field.value.slice(end);
    const caret = start + pad.length + text.length;
    try { field.setSelectionRange(caret, caret); } catch {}
    // data-bind models listen for input events — a silent .value change would be lost
    field.dispatchEvent(new Event("input", {bubbles: true}));
  };

  const langTag = code => ({uk: "uk-UA", en: "en-US", de: "de-DE", fr: "fr-FR", pl: "pl-PL",
    es: "es-ES", it: "it-IT", cs: "cs-CZ", pt: "pt-PT", ja: "ja-JP"})[code] || code;

  const start = () => {
    rec = new SR();
    // dictation follows the BOOK's language (that's what the text is written in)
    rec.lang = langTag(S.project?.result?.book?.settings?.language || S.lang || "uk");
    rec.continuous = true;
    rec.interimResults = false;
    rec.onresult = ev => {
      for (let i = ev.resultIndex; i < ev.results.length; i++)
        if (ev.results[i].isFinal) insert(ev.results[i][0].transcript.trim());
    };
    rec.onerror = ev => {
      if (ev.error === "not-allowed" || ev.error === "service-not-allowed")
        showToast(t("ui.dictate.denied"), "err");
      else if (ev.error !== "no-speech" && ev.error !== "aborted")
        showToast(t("ui.dictate.fail", {e: ev.error}), "err");
    };
    rec.onend = () => {  // fires on stop(), errors, and silence timeouts alike
      rec = null;
      mic.classList.remove("rec");
      if (document.activeElement !== mic && !editable(document.activeElement)) hide();
      else place();
    };
    try { rec.start(); mic.classList.add("rec"); place(); }
    catch { rec = null; mic.classList.remove("rec"); }
  };

  mic.addEventListener("mousedown", e => e.preventDefault());  // keep the field focused
  mic.addEventListener("click", () => {
    if (rec) { try { rec.stop(); } catch {} }
    else if (field) start();
  });
})();

/* ---------- boot ---------- */
(async () => {
  try {
    await loadI18n();
    await load();
  } catch (e) {
    $("#pane").innerHTML = `<div class="empty-state"><h3>${esc(t("ui.load_fail"))}</h3><p>${esc(e.message)}</p></div>`;
  }
})();

</script>
</body>
</html>
